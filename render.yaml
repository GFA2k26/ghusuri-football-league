services:
  - type: web
    name: gfl-2026
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_UPLOADS_DIR
        value: /var/data/uploads
      - key: PRIVATE_UPLOADS_DIR
        value: /var/data/private
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: GFL_EMAIL_USER
        sync: false
      - key: GFL_EMAIL_APP_PASSWORD
        sync: false
      - key: GFL_EMAIL_FROM
        sync: false
    disk:
      name: gfl-data
      mountPath: /var/data
      sizeGB: 10
