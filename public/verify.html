<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>GFL Player Verification</title><style>body{font-family:Arial;background:#070a10;color:#fff}.wrap{max-width:650px;margin:auto;padding:40px 5%}.card{background:#101620;border:1px solid #28313d;border-radius:14px;padding:25px}.photo{width:120px;height:145px;object-fit:cover;border-radius:10px}.ok{color:#38e38b}</style></head><body><main class=wrap><div class=card id=x>Checking verification...</div></main><script>const q=new URLSearchParams(location.search).get('reg');fetch('/api/player/'+encodeURIComponent(q||'')).then(r=>r.json()).then(p=>{x.innerHTML=p.error?'<h2>Not Verified</h2><p>'+p.error+'</p>':`<h1 class=ok>✓ VERIFIED</h1>${p.photo?`<img class=photo src=/uploads/${p.photo}>`:''}<h2>${p.name}</h2><p>Team: ${p.team_name}</p><p>Registration: <b>${q}</b></p><p>Jersey: ${p.jersey||'-'} • Position: ${p.position||'-'}</p><p>This player is verified by the Ghusuri Football League system.</p>`}).catch(()=>x.innerHTML='<h2>Verification unavailable</h2>')</script></body></html>
